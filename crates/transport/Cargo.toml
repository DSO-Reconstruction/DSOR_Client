[package]
name = "dsor-transport"
description = "Datagram transport: UDP natively, the WebSocket relay in the browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
log.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "ErrorEvent",
    "CloseEvent",
    "Event",
] }
