[package]
name = "dsor-relay"
description = "WebSocket <-> UDP relay carrying RakNet datagrams for the browser client"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "dsor_relay"
path = "src/lib.rs"

[[bin]]
name = "dsor-relay"
path = "src/main.rs"

[dependencies]
log.workspace = true
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
