[workspace]
resolver = "2"
members = ["crates/raknet", "crates/proto", "crates/transport", "crates/relay", "client"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
dsor-raknet = { path = "crates/raknet" }
dsor-proto = { path = "crates/proto" }
dsor-transport = { path = "crates/transport" }
log = "0.4"
bevy = { version = "0.19", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Bevy compiles slowly unoptimised and runs badly in debug; dependencies get
# optimised even in dev builds, our own crates stay quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The size-tuned profile for the browser build (trunk build --release uses it via
# the client's index.html data-cargo-profile).
[profile.wasm-release]
inherits = "release"
# Speed, not size: "s" kept bevy's hot loops (animation, queries, render
# preparation) from being inlined -- the browser runs one thread, every
# millisecond counts.
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "debuginfo"

# Profiling the browser build: same code as wasm-release, symbol names kept.
# Fast iteration in the browser (tools/build_web.sh --fast): dependencies
# optimised once and cached (dev.package."*"), our crate barely optimised and
# incremental, no LTO, no wasm-opt (a non-release trunk build).
[profile.wasm-fast]
inherits = "dev"
debug = false
incremental = true
codegen-units = 256

[profile.wasm-fast.package."*"]
opt-level = 3

[profile.wasm-profile]
inherits = "wasm-release"
strip = "none"
