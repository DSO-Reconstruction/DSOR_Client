<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSOR</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<!-- The browser client's loader (tools/build_web.sh): the WebGPU build when the
     browser gives a WebGPU adapter, the WebGL2 build otherwise. ?gpu=webgl2 or
     ?gpu=webgpu forces one. Game data: serve the converted asset tree as assets/
     next to this page. Pick a map with ?map=a0302_wildforest -->
<body>
<script type="module">
  const asked = new URLSearchParams(location.search).get('gpu');
  async function webgpu() {
    try {
      return !!(navigator.gpu && await navigator.gpu.requestAdapter());
    } catch (e) {
      return false;
    }
  }
  const kind = asked === 'webgl2' || asked === 'webgpu' ? asked : (await webgpu() ? 'webgpu' : 'webgl2');
  console.log(`DSOR: ${kind} build`);
  const client = await import(`./${kind}/dsor-client.js`);
  await client.default({ module_or_path: `./${kind}/dsor-client_bg.wasm` });
</script>
</body>
</html>
