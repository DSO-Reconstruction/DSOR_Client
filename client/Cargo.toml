[package]
name = "dsor-client"
description = "Drakensang Online client on Bevy, native and WebAssembly"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
dsor-raknet.workspace = true
dsor-proto.workspace = true
dsor-transport.workspace = true
# 3d: PBR + glTF + scenes; ui: the FPS/entity text; free_camera: WASD + mouse fly
# camera. No audio for now.
bevy = { workspace = true, features = ["3d", "ui", "png", "free_camera", "default_font"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The glTF document types bevy_gltf hands to extension handlers (same version).
gltf = { version = "1.4.1", default-features = false, features = ["extras"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Reads ?map=... from the page URL.
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Performance"] }
